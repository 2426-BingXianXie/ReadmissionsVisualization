<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@5.20.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}, "axis": {"labelFont": "Times New Roman", "titleFont": "Times New Roman"}, "legend": {"labelFont": "Times New Roman", "titleFont": "Times New Roman"}, "title": {"font": "Times New Roman", "fontSize": 16}}, "data": {"name": "data-03e585b049dfdc5a291b6fb31b7c9a4b"}, "mark": {"type": "bar"}, "encoding": {"color": {"field": "readmitted", "title": "Readmitted", "type": "nominal"}, "tooltip": [{"field": "treatment_cat", "title": "Treatment Intensity", "type": "nominal"}, {"field": "readmitted", "title": "Readmitted", "type": "nominal"}, {"field": "count", "title": "Number of Patients", "type": "quantitative"}], "x": {"field": "treatment_cat", "sort": ["Very Low", "Low", "High", "Very High"], "title": "Treatment Intensity", "type": "nominal"}, "y": {"field": "count", "stack": "normalize", "title": "Proportion of Patients", "type": "quantitative"}}, "height": 400, "title": "Treatment Intensity vs Readmission (Stacked Proportion)", "width": 600, "$schema": "https://vega.github.io/schema/vega-lite/v5.20.1.json", "datasets": {"data-03e585b049dfdc5a291b6fb31b7c9a4b": [{"treatment_cat": "Very Low", "readmitted": "no", "count": 1919}, {"treatment_cat": "Very Low", "readmitted": "yes", "count": 1412}, {"treatment_cat": "Low", "readmitted": "no", "count": 1835}, {"treatment_cat": "Low", "readmitted": "yes", "count": 1371}, {"treatment_cat": "High", "readmitted": "no", "count": 1549}, {"treatment_cat": "High", "readmitted": "yes", "count": 1400}, {"treatment_cat": "Very High", "readmitted": "no", "count": 1617}, {"treatment_cat": "Very High", "readmitted": "yes", "count": 1515}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
